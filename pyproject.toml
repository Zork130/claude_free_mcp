[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-free-mcp"
version = "0.1.0"
description = "MCP server that gives Claude Desktop Claude Code-style tools (files, search, shell, todos)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
claude-free-mcp = "claude_free_mcp.server:main"

[tool.setuptools.packages.find]
include = ["claude_free_mcp*"]
